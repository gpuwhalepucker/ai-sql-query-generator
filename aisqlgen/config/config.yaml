# Default config for ai-sql-query-generator.
# Copy to ~/.aisqlgen/config.yaml to override without touching the repo.
dialect: postgres

llm:
  provider: ollama
  model: qwen2.5-coder:7b
  base_url: http://127.0.0.1:11434/v1
  api_key_env: AISQLGEN_API_KEY
  temperature: 0.1
  max_tokens: 1024
  timeout_s: 60.0

guard:
  allow_write: false
  max_statements: 1
  deny_keywords:
    - attach
    - detach
    - pragma
    - copy
    - load_file
    - xp_cmdshell

schema_char_budget: 32000