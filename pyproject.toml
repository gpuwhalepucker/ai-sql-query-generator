[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sql-query-generator"
version = "0.4.2"
description = "Windows desktop tool that turns natural-language prompts into dialect-aware SQL."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ai-sql-query-generator maintainers" },
]
keywords = ["sql", "llm", "query-generator", "desktop", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "pydantic>=2.6,<3",
    "sqlglot>=23.0",
    "httpx>=0.27",
    "rich>=13.7",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]
mssql = ["pyodbc>=5.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
aisqlgen = "aisqlgen.__main__:main"

[tool.setuptools.packages.find]
include = ["aisqlgen*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]